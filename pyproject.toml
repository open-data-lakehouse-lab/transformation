[project]
name = "odl-transformation"
version = "0.1.0"
description = "Open Data Lakehouse Lab Transformation Repository"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.scripts]
odl-transformation = "odl_transformation.cli:app"

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
